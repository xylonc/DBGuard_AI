spec_id: "cis-pg17-v1.1.0:3.1.15"
schema_version: 1
authored_by: agent
ref:
  benchmark: "CIS PostgreSQL 17 Benchmark"
  benchmark_version: "1.1.0"
  pg_major: 17
  recommendation: "3.1.15"
  title: "Ensure the correct SQL statements generating errors are recorded"
  source_sha256: "3748c41ccbb7bd49f44b58bba337b190d813f7588ad5a015d594328cb00f89ec"
tier: automated
reason: null
check:
  kind: setting
  setting_name: log_min_error_statement
  query: "SHOW log_min_error_statement"
  operator: severity
  direction: at_or_more_verbose
  expected: "error"
  pass_condition_quote: "If not configured to at least `error`, this is a fail."
proof:
  break:
    setting_name: log_min_error_statement
    value: "panic"
  fix:
    setting_name: log_min_error_statement
    value: "error"
interpretation:
  - "\"At least `error`\" is read, per the CIS description (\"The lower the level (vertically, below), the fewer messages are recorded\"), as recording at least as much as `error`, so `error` or any more verbose level passes and `log`, `fatal` and `panic` fail. Very verbose levels such as `debug5` also pass, because the CIS fail sentence does not limit verbosity (Gate 1 ruling A2)."
