  evaluator: host_hba_rules
  pass_condition_quote: "Login authentication can be tested via TCP/IP SOCKETS by any UNIX user account from the local host."
interpretation:
  - "DBGuard cannot run CIS's login tests. It lists every TCP/IP login rule (types starting with `host`) from the rules file view, in file order, with databases, users, address, netmask and method (Gate W2B table A and round 2 ruling 4). A person decides."
  - "Methods `trust`, `password` and `ident` are highlighted because the CIS description says they are not to be used for remote logins, and `md5` because CIS recommends `scram-sha-256` instead (Gate W2B round 2 ruling 4)."
  - "Rules open to every address (0.0.0.0/0, the IPv6 equivalent ::/0 and the keyword `all`) are also highlighted (Gate W2B table A). Highlighting is evidence emphasis, not a fail rule, and the result stays MANUAL."
  - "Lines with an error are listed too, because their type cannot be trusted. The file view may differ from the loaded rules until a reload."
