name: dbguard-ai

# Current runnable POC: one API plus one pgvector database. HERMES packaging
# remains an integration artifact until a real base image is supplied. The
# assessment, reporting, and twin-runner services are intentionally not started.
services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: dbguardai/api:0.2.0
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://dbguard:${DBGUARD_DB_PASSWORD:-dbguard-local-only}@postgres:5432/dbguard
      SNAPSHOT_STORAGE_DIR: /app/data/snapshots
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      LLM_MODEL: ${LLM_MODEL:-llama3.1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      OLLAMA_API_URL: ${OLLAMA_API_URL:-http://host.docker.internal:11434}
    volumes:
      - snapshots:/app/data/snapshots
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: dbguard
      POSTGRES_USER: dbguard
      POSTGRES_PASSWORD: ${DBGUARD_DB_PASSWORD:-dbguard-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbguard -d dbguard"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  snapshots:
