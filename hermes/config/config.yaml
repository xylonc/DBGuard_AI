_config_version: 39

model:
  provider: custom
  default: llama3.1
  base_url: http://host.docker.internal:11434/v1
  api_key: ollama-local

terminal:
  # No Docker socket is mounted and terminal/code toolsets are disabled. This
  # remains a second fail-closed layer if a future config change exposes them.
  backend: docker
  cwd: /opt/data/workspace

# The dashboard chat and OpenAI-compatible API receive only the DBGuard MCP
# toolset. HERMES must never gain shell, filesystem, browser or database access.
toolsets:
  - mcp-dbguard

platform_toolsets:
  cli:
    - mcp-dbguard
  api_server:
    - mcp-dbguard

agent:
  reasoning_effort: low
  tool_use_enforcement: true
  disabled_toolsets:
    - browser
    - code_execution
    - cronjob
    - delegation
    - file
    - memory
    - process
    - session_search
    - terminal
    - web

# Values are injected from environment variables by configure.py at startup.
# Keeping the password out of this file avoids baking credentials into images.
dashboard:
  basic_auth:
    username: __DBGUARD_DASHBOARD_USERNAME__
    password_hash: __DBGUARD_DASHBOARD_PASSWORD_HASH__

mcp_servers:
  dbguard:
    url: http://mcp:8001/mcp
    enabled: true
    supports_parallel_tool_calls: false
    tools:
      include:
        - get_snapshot_context
        - search_approved_knowledge
        - search_approved_templates
        - compile_hardening_proposal
      prompts: false
      resources: false
