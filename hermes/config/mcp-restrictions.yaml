version: "0.2.0"
app: DBGuardAI
scope: proposal

# HERMES can read evidence and prepare a proposal. It cannot assess, execute,
# approve, or connect to a database in this phase.
allowed_tools:
  - name: get_snapshot_context
    description: "Read normalized metadata from an uploaded collector snapshot"
    schema:
      snapshot_id: string

  - name: search_approved_knowledge
    description: "Retrieve approved, currently applicable PostgreSQL guidance"
    schema:
      query: string
      pg_version: string
      environment: string
      top_k: integer

  - name: search_approved_templates
    description: "Find DBA-reviewed SQL templates relevant to a requirement"
    schema:
      query: string
      top_k: integer

  - name: create_hardening_proposal
    description: "Create a review-only hardening proposal from snapshot evidence and approved sources"
    schema:
      snapshot_id: string
      requirement: string

prohibited_tools:
  - run_shell
  - run_docker
  - run_arbitrary_sql
  - connect_to_database
  - connect_to_production
  - execute_hardening
  - start_assessment
  - approve_own_action
  - modify_knowledge_lifecycle
  - bypass_approval_policy

prompt_protections:
  separate_instructions: true
  validate_output: true
  whitelist_tools: true
  evidence_never_executes: true

gateway:
  host: "0.0.0.0"
  port: 8080
  health_check_path: "/health"
  tool_timeout: 120
  max_output_size: 100000
