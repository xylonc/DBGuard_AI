[pytest]
pythonpath = backend .
testpaths = tests
addopts = --ignore=tests/test_api_routes.py -m "not live and not tier_b"
markers =
    tier_a: Pure unit tests with zero external dependencies
    tier_b: Tests requiring live PostgreSQL + pgvector + embedding endpoint
    tier_c: End-to-end lifecycle tests with stubbed providers
    legacy_sandbox: legacy twin-runner sandbox tests, superseded by Phase 2; expected to fail until then
    live: marks tests that require a live pg-target database connection
xfail_strict = true
